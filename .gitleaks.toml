title = "Ruth Gitleaks Secret Scanning Configuration"

[extend]
useDefault = true

[allowlist]
description = "Synthetic local-dev template placeholders and isolated xUnit test fixtures"
paths = [
  '''^\.env\.example$''',
  '''^docker-compose\.yml$''',
  '''^docs/SECURITY\.md$''',
  '''^tests/.*\.cs$''',
  '''^\.agents/skills/.*''',
]
regexes = [
  '''replace-with-a-unique-random-32-plus-character-[a-z-]+''',
  '''ruth-dev-only-[a-z0-9-]+''',
]
