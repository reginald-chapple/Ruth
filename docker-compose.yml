name: ruth

services:
  postgres:
    build:
      context: ./deploy/docker/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruth}
      POSTGRES_USER: ${POSTGRES_USER:-ruth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruth_secret}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backing
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruth} -d ${POSTGRES_DB:-ruth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-ruth_redis_local_dev_pw}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - backing
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:-ruth_redis_local_dev_pw} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.7@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    networks:
      - backing
    volumes:
      - rustfs_data:/data

  ruth-host:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/dotnet/Dockerfile
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__RuthDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ruth};Username=${POSTGRES_USER:-ruth};Password=${POSTGRES_PASSWORD:-ruth_secret}
      Persistence__Rls__UseNonSuperuserAppRole: "true"
      Persistence__Rls__MigratorRoleName: ruth_migrator
      Persistence__Rls__AppRoleName: ruth_app
      Persistence__Rls__AppRolePassword: ${RUTH_APP_DB_PASSWORD:-ruth_app_rls_local_dev_pw}
      Tenancy__SandboxBaseDomain: ${Tenancy__SandboxBaseDomain:-sandbox.localhost}
      Tenancy__PlatformOperatorHost: ${Tenancy__PlatformOperatorHost:-ops.localhost}
      Tenancy__StripeMockMode: ${Tenancy__StripeMockMode:-true}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-ruth_redis_local_dev_pw},abortConnect=false
      Storage__RustFs__Endpoint: http://rustfs:9000
      Storage__RustFs__BucketName: ${RUSTFS_BUCKET:-ruth}
      Storage__RustFs__AccessKey: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      Storage__RustFs__SecretKey: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      Authentication__Jwt__SigningKey: ${Authentication__Jwt__SigningKey:-replace-with-a-unique-random-32-plus-character-secret-in-production}
      Security__CredentialEncryption__ActiveKeyId: ${Security__CredentialEncryption__ActiveKeyId:-k1}
      Security__CredentialEncryption__MasterKey: ${Security__CredentialEncryption__MasterKey:-replace-with-a-unique-random-32-plus-character-kek-in-production}
      Bootstrap__AutoMigrateAndSeed: ${Bootstrap__AutoMigrateAndSeed:-true}
    ports:
      - "127.0.0.1:${RUTH_HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - backing

networks:
  edge:
    driver: bridge
  backing:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
